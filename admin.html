<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>小唯管理系统 - 管理端</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--primary:#1abc9c;--primary-dark:#16a085;--primary-light:#e8f8f5;--blue:#3498db;--orange:#f39c12;--purple:#8e44ad;--teal:#0097a7;--danger:#e74c3c;--success:#27ae60;--bg:#f0f2f5;--card-bg:#fff;--text:#2c3e50;--text-muted:#7f8c8d;--border:#ecf0f1;--shadow:0 1px 4px rgba(0,0,0,.06)}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
button{border:none;outline:none;cursor:pointer;font-family:inherit}
input{font-family:inherit;font-size:14px;outline:none}
::-webkit-scrollbar{display:none}
.hidden{display:none!important}
.login{position:fixed;inset:0;background:linear-gradient(135deg,#1abc9c,#16a085);display:flex;align-items:center;justify-content:center;padding:30px;z-index:100}
.login-card{background:#fff;border-radius:16px;padding:28px 24px;width:100%;max-width:340px;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.login-logo{text-align:center;margin-bottom:20px}
.ll-icon{width:56px;height:56px;background:linear-gradient(135deg,#1abc9c,#16a085);border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-size:28px;color:#fff;margin-bottom:8px}
.ll-title{font-size:18px;font-weight:700}
.ll-sub{font-size:12px;color:var(--text-muted);margin-top:2px}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:4px}
.login-field input{width:100%;height:42px;border:1px solid #ddd;border-radius:8px;padding:0 12px}
.login-field input:focus{border-color:var(--primary)}
.login-btn{width:100%;height:44px;background:linear-gradient(135deg,#1abc9c,#16a085);color:#fff;border-radius:10px;font-size:15px;font-weight:600;margin-top:6px}
.login-btn:disabled{opacity:.6}
.login-hint{text-align:center;margin-top:14px;font-size:12px;color:var(--text-muted)}
.port-select{position:fixed;inset:0;background:var(--bg);z-index:90;display:flex;flex-direction:column}
.port-select-header{background:linear-gradient(135deg,#1abc9c,#16a085);padding:40px 20px 30px;text-align:center}
.port-select-header h2{color:#fff;font-size:20px;margin-bottom:4px}
.port-select-header p{color:rgba(255,255,255,.8);font-size:13px}
.port-grid{padding:20px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.port-card{background:#fff;border-radius:12px;padding:16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
.port-card:active{transform:scale(.98)}
.pc-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.pc-info{flex:1}
.pc-name{font-size:15px;font-weight:600}
.pc-desc{font-size:12px;color:var(--text-muted);margin-top:2px}
.pc-arrow{color:#ccc;font-size:18px}
.app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:48px;display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0;color:#fff}
.topbar.port-platform{background:linear-gradient(90deg,#1abc9c,#16a085)}
.topbar.port-clinic{background:linear-gradient(90deg,#3498db,#2980b9)}
.topbar.port-dealer{background:linear-gradient(90deg,#f39c12,#e67e22)}
.topbar.port-pharmacy{background:linear-gradient(90deg,#8e44ad,#9b59b6)}
.topbar.port-factory{background:linear-gradient(90deg,#0097a7,#00b8d4)}
.topbar-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
.topbar-title{flex:1;font-size:16px;font-weight:600;text-align:center}
.topbar-port-btn{background:rgba(255,255,255,.2);border-radius:14px;padding:3px 10px;font-size:11px;cursor:pointer}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:260px;background:#fff;z-index:200;transform:translateX(-100%);transition:transform .3s;display:flex;flex-direction:column}
.sidebar.show{transform:translateX(0)}
.sidebar-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:150;opacity:0;pointer-events:none;transition:opacity .3s}
.sidebar-mask.show{opacity:1;pointer-events:auto}
.sidebar-header{padding:20px 16px;color:#fff;flex-shrink:0}
.sh-avatar{width:44px;height:44px;background:rgba(255,255,255,.25);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:8px}
.sh-name{font-size:15px;font-weight:600}
.sh-role{font-size:12px;opacity:.8;margin-top:2px}
.sidebar-body{flex:1;overflow-y:auto;padding:8px 0}
.sidebar-group{margin-bottom:8px}
.sidebar-group-title{padding:8px 16px 4px;font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:14px;cursor:pointer}
.sidebar-item:active,.sidebar-item.active{background:var(--primary-light);color:var(--primary-dark)}
.si-icon{font-size:18px;width:24px;text-align:center}
.content{flex:1;overflow-y:auto;padding-bottom:60px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.stat-card{background:#fff;border-radius:10px;padding:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px}
.sc-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.sc-value{font-size:20px;font-weight:700}
.sc-label{font-size:11px;color:var(--text-muted)}
.qg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 12px 12px}
.qg-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;background:#fff;border-radius:10px;cursor:pointer}
.qg-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.qg-name{font-size:11px;text-align:center}
.section{padding:12px}
.section-title{font-size:13px;font-weight:600;margin-bottom:8px}
.card-list{display:flex;flex-direction:column;gap:8px;padding:0 12px}
.data-card{background:#fff;border-radius:10px;padding:12px;box-shadow:var(--shadow)}
.dc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.dc-title{font-size:14px;font-weight:600}
.dc-sub{font-size:12px;color:var(--text-muted);margin-top:2px}
.dc-body{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px}
.dc-field{font-size:12px}
.dc-field span{color:var(--text-muted)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.badge-success{background:#e8f8f0;color:#27ae60}
.badge-warning{background:#fef5e7;color:#f39c12}
.badge-danger{background:#fdeaea;color:#e74c3c}
.badge-info{background:#e8f4fd;color:#3498db}
.filter-bar{display:flex;gap:6px;padding:8px 12px;overflow-x:auto}
.filter-chip{padding:4px 12px;border-radius:14px;font-size:12px;white-space:nowrap;cursor:pointer;background:#fff;border:1px solid var(--border);color:var(--text-muted)}
.filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.search-bar{padding:8px 12px}
.search-bar input{width:100%;height:36px;border:1px solid var(--border);border-radius:18px;padding:0 16px;font-size:13px;background:#fff}
.empty{text-align:center;padding:40px 20px;color:var(--text-muted)}
.empty .em-icon{font-size:48px;margin-bottom:8px;opacity:.3}
.tabbar{position:fixed;bottom:0;left:0;right:0;height:56px;background:#fff;display:flex;border-top:1px solid var(--border);z-index:100}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--text-muted)}
.tab.active{color:var(--primary)}
.tab .t-icon{font-size:20px}
.tab .t-name{font-size:10px}
.subpage{position:fixed;inset:0;background:var(--bg);z-index:300;display:none;flex-direction:column}
.subpage.active{display:flex}
.subpage-header{height:48px;display:flex;align-items:center;padding:0 12px;gap:8px;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0}
.sh-back{font-size:24px;cursor:pointer;width:32px}
.sh-title{flex:1;font-size:16px;font-weight:600;text-align:center}
.subpage-body{flex:1;overflow-y:auto}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:400;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:#fff;width:100%;max-width:500px;border-radius:16px 16px 0 0;max-height:85vh;overflow-y:auto}
.modal-header{padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:1}
.mh-title{font-size:16px;font-weight:600}
.mh-close{font-size:22px;cursor:pointer;color:var(--text-muted)}
.modal-body{padding:16px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:4px}
.form-group input,.form-group select{width:100%;height:40px;border:1px solid #ddd;border-radius:8px;padding:0 12px;font-size:13px}
.form-actions{display:flex;gap:8px;padding-top:8px}
.form-actions button{flex:1;height:42px;border-radius:8px;font-size:14px;font-weight:600}
.btn-primary{background:var(--primary);color:#fff}
.btn-secondary{background:#f5f5f5;color:var(--text)}
.btn-danger{background:var(--danger);color:#fff}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:9999;opacity:0;pointer-events:none;transition:opacity .3s;max-width:80%;text-align:center}
.toast.show{opacity:1}
.confirm-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:center;justify-content:center}
.confirm-bg.show{display:flex}
.confirm-box{background:#fff;border-radius:12px;padding:20px;width:280px;text-align:center}
.cb-msg{font-size:14px;margin-bottom:16px}
.cb-actions{display:flex;gap:8px}
.cb-actions button{flex:1;height:38px;border-radius:8px;font-size:14px}
.cb-ok{background:var(--primary);color:#fff}
.cb-cancel{background:#f5f5f5;color:var(--text)}
.settings-group{margin:12px;background:#fff;border-radius:10px;overflow:hidden}
.settings-item{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.settings-item:last-child{border-bottom:none}
</style>
</head>
<body>

<!-- Login -->
<div class="login" id="loginPage">
  <div class="login-card">
    <div class="login-logo">
      <div class="ll-icon">🦷</div>
      <div class="ll-title">小唯管理系统</div>
      <div class="ll-sub">管理端登录</div>
    </div>
    <div class="login-field">
      <label>账号</label>
      <input type="text" id="loginAccount" value="admin">
    </div>
    <div class="login-field">
      <label>密码</label>
      <input type="password" id="loginPassword" value="123456">
    </div>
    <button class="login-btn" id="loginBtn" type="button">登 录</button>
    <div class="login-hint">测试账号: admin / clinic / dealer / pharmacy / factory 密码: 123456</div>
  </div>
</div>

<!-- Port selection -->
<div class="port-select hidden" id="portSelectPage">
  <div class="port-select-header">
    <h2>选择管理端口</h2>
    <p id="portSelectUser">请选择要进入的管理端口</p>
  </div>
  <div class="port-grid" id="portGrid"></div>
</div>

<!-- Main app -->
<div class="app hidden" id="mainApp">
  <div class="topbar port-platform" id="topbar">
    <div class="topbar-btn" onclick="toggleSidebar()">☰</div>
    <div class="topbar-title" id="topbarTitle">首页</div>
    <div class="topbar-port-btn" onclick="logout()">
      <span id="topbarPortName">平台</span> 退出
    </div>
  </div>
  <div class="content" id="contentArea"></div>
  <div class="tabbar" id="tabbar">
    <div class="tab active" onclick="switchTab('home')"><div class="t-icon">📊</div><div class="t-name">首页</div></div>
    <div class="tab" onclick="switchTab('manage')"><div class="t-icon">📋</div><div class="t-name">管理</div></div>
    <div class="tab" onclick="switchTab('medical')"><div class="t-icon">📋</div><div class="t-name">病历</div></div>
    <div class="tab" onclick="switchTab('finance')"><div class="t-icon">💰</div><div class="t-name">财务</div></div>
    <div class="tab" onclick="switchTab('mine')"><div class="t-icon">⚙️</div><div class="t-name">我的</div></div>
  </div>
</div>

<!-- Sidebar -->
<div class="sidebar-mask" id="sidebarMask" onclick="toggleSidebar()"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header" id="sidebarHeader">
    <div class="sh-avatar" id="sidebarAvatar">管</div>
    <div class="sh-name" id="sidebarName">管理员</div>
    <div class="sh-role" id="sidebarRole">平台端</div>
  </div>
  <div class="sidebar-body" id="sidebarBody"></div>
</div>

<!-- Subpage -->
<div class="subpage" id="subpage">
  <div class="subpage-header">
    <div class="sh-back" onclick="closeSubpage()">‹</div>
    <div class="sh-title" id="subpageTitle">详情</div>
    <div style="width:32px"></div>
  </div>
  <div class="subpage-body" id="subpageBody"></div>
</div>

<!-- Modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="mh-title" id="modalTitle">编辑</div>
      <div class="mh-close" onclick="closeModal()">×</div>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Confirm -->
<div class="confirm-bg" id="confirmBg">
  <div class="confirm-box">
    <div class="cb-msg" id="confirmMsg">确认？</div>
    <div class="cb-actions">
      <button class="cb-cancel" onclick="closeConfirm()">取消</button>
      <button class="cb-ok" id="confirmOkBtn">确定</button>
    </div>
  </div>
</div>

// ==================== Helper Functions ====================
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show')},2000);
}

function showConfirm(msg,cb){
  document.getElementById('confirmMsg').textContent=msg;
  document.getElementById('confirmBg').classList.add('show');
  document.getElementById('confirmOkBtn').onclick=function(){
    document.getElementById('confirmBg').classList.remove('show');
    cb();
  };
}
function closeConfirm(){
  document.getElementById('confirmBg').classList.remove('show');
}

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('show');
  document.getElementById('sidebarMask').classList.toggle('show');
}

function closeSubpage(){
  document.getElementById('subpage').classList.remove('active');
}

function closeModal(){
  document.getElementById('modalBg').classList.remove('show');
}

function badge(status){
  var map={approved:'success',active:'success',completed:'success',used:'info',pending:'warning',shipped:'info',production:'warning',inProgress:'warning',inactive:'danger'};
  var label={approved:'已审核',active:'正常',completed:'已完成',used:'已使用',pending:'待处理',shipped:'已发货',production:'生产中',inProgress:'进行中',inactive:'已停用'};
  return '<span class="badge badge-'+(map[status]||'info')+'">'+(label[status]||status)+'</span>';
}

// ==================== Login ====================
function showLogin(){
  document.getElementById('loginPage').classList.remove('hidden');
  document.getElementById('portSelectPage').classList.add('hidden');
  document.getElementById('mainApp').classList.add('hidden');
}

function doLogin(){
  var a=document.getElementById('loginAccount').value.trim();
  var p=document.getElementById('loginPassword').value.trim();
  if(!a||!p){showToast('请输入账号和密码');return}
  var btn=document.getElementById('loginBtn');
  btn.disabled=true;btn.textContent='登录中...';
  var acc=ACCOUNTS[a];
  if(acc&&acc.password===p){
    userInfo={name:acc.name,avatar:acc.avatar,ports:acc.ports,account:a};
    localStorage.setItem('adminToken','local_'+a+'_'+Date.now());
    localStorage.setItem('adminUserInfo',JSON.stringify(userInfo));
    btn.disabled=false;btn.textContent='登 录';
    showPortSelect();
  }else{
    btn.disabled=false;btn.textContent='登 录';
    showToast('账号或密码错误');
  }
}

// ==================== Port Selection ====================
function showPortSelect(){
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('mainApp').classList.add('hidden');
  var ps=document.getElementById('portSelectPage');
  ps.classList.remove('hidden');
  document.getElementById('portSelectUser').textContent='欢迎，'+(userInfo?userInfo.name:'')+'，请选择要进入的管理端口';
  var ports=userInfo?userInfo.ports:['platform'];
  var html='';
  Object.keys(PORT_CONFIG).forEach(function(key){
    var p=PORT_CONFIG[key];
    var enabled=ports.indexOf(key)>=0;
    if(enabled){
      html+='<div class="port-card" onclick="selectPort(\''+key+'\')">';
    }else{
      html+='<div class="port-card" style="opacity:.4;pointer-events:none">';
    }
    html+='<div class="pc-icon" style="background:'+p.color+'20">'+p.icon+'</div>';
    html+='<div class="pc-info"><div class="pc-name">'+p.name+'</div><div class="pc-desc">'+(enabled?p.desc:'无访问权限')+'</div></div>';
    html+='<div class="pc-arrow">›</div></div>';
  });
  document.getElementById('portGrid').innerHTML=html;
}

function selectPort(port){
  currentPort=port;
  localStorage.setItem('adminPort',port);
  document.getElementById('portSelectPage').classList.add('hidden');
  showMain();
}

function logout(){
  localStorage.removeItem('adminToken');
  localStorage.removeItem('adminUserInfo');
  localStorage.removeItem('adminPort');
  userInfo=null;token=null;currentPort='';
  showLogin();
}

// ==================== Main App ====================
function showMain(){
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('portSelectPage').classList.add('hidden');
  var app=document.getElementById('mainApp');
  app.classList.remove('hidden');
  
  var pc=PORT_CONFIG[currentPort];
  if(!pc){showToast('端口错误');return}
  
  var tb=document.getElementById('topbar');
  tb.className='topbar port-'+currentPort;
  document.getElementById('topbarPortName').textContent=pc.short;
  
  var sh=document.getElementById('sidebarHeader');
  sh.style.background='linear-gradient(135deg,'+pc.color+','+pc.color+'dd)';
  document.getElementById('sidebarAvatar').textContent=userInfo?userInfo.avatar:'?';
  document.getElementById('sidebarName').textContent=userInfo?userInfo.name:'';
  document.getElementById('sidebarRole').textContent=pc.name;
  
  buildSidebar();
  currentPage='home';
  currentTab='home';
  navigateTo('home');
  updateTabs();
}

function buildSidebar(){
  var menus=PORT_MENUS[currentPort]||[];
  var html='';
  menus.forEach(function(group){
    html+='<div class="sidebar-group">';
    html+='<div class="sidebar-group-title">'+group.group+'</div>';
    group.items.forEach(function(item){
      html+='<div class="sidebar-item'+(currentPage===item.key?' active':'')+'" onclick="navigateTo(\''+item.key+'\')">';
      html+='<span class="si-icon">'+item.icon+'</span><span>'+item.name+'</span>';
      html+='</div>';
    });
    html+='</div>';
  });
  document.getElementById('sidebarBody').innerHTML=html;
}

function navigateTo(page){
  currentPage=page;
  toggleSidebar();
  
  var menus=PORT_MENUS[currentPort]||[];
  var title='首页';
  for(var i=0;i<menus.length;i++){
    for(var j=0;j<menus[i].items.length;j++){
      if(menus[i].items[j].key===page){title=menus[i].items[j].name;break}
    }
  }
  if(page==='home')title='首页';
  document.getElementById('topbarTitle').textContent=title;
  
  var items=document.querySelectorAll('.sidebar-item');
  items.forEach(function(it){it.classList.remove('active')});
  
  renderPage(page);
}

function updateTabs(){
  var tabs=document.querySelectorAll('.tab');
  tabs.forEach(function(t){t.classList.remove('active')});
  var activeTab=document.querySelector('.tab');
  if(activeTab)activeTab.classList.add('active');
}

function switchTab(tab){
  currentTab=tab;
  var tabs=document.querySelectorAll('.tab');
  tabs.forEach(function(t){t.classList.remove('active')});
  event.currentTarget.classList.add('active');
  
  if(tab==='home'){navigateTo('home')}
  else if(tab==='manage'){navigateTo(getFirstManagePage())}
  else if(tab==='medical'){navigateTo('patientQuery')}
  else if(tab==='finance'){navigateTo('finance')}
  else if(tab==='mine'){navigateTo('settings')}
}

function getFirstManagePage(){
  var menus=PORT_MENUS[currentPort]||[];
  for(var i=0;i<menus.length;i++){
    for(var j=0;j<menus[i].items.length;j++){
      var key=menus[i].items[j].key;
      if(key!=='home'&&key!=='patientQuery'&&key!=='finance'&&key!=='settings'&&key!=='reports'){
        return key;
      }
    }
  }
  return 'home';
}

function renderList(content,dataKey,title,fields,titleField){
  var data=MOCK[dataKey]||[];
  var html='';
  html+='<div class="search-bar"><input type="text" placeholder="搜索'+title+'..." oninput="filterList(this,\''+dataKey+'\')"></div>';
  html+='<div class="filter-bar">';
  var statuses=['all','approved','pending','active','completed','used','shipped','production'];
  statuses.forEach(function(s){
    if(s==='all'||data.some(function(d){return d.status===s})){
      html+='<div class="filter-chip'+(s==='all'?' active':'')+'" onclick="filterStatus(this,\''+dataKey+'\',\''+s+'\')">'+(s==='all'?'全部':s)+'</div>';
    }
  });
  html+='</div>';
  html+='<div class="card-list" id="listContainer">';
  data.forEach(function(item){
    html+=renderCard(item,fields,titleField);
  });
  html+='</div>';
  content.innerHTML=html;
}

function renderCard(item,fields,titleField){
  var html='<div class="data-card">';
  html+='<div class="dc-header"><div class="dc-title">'+(item[titleField]||item.name||item.id)+'</div>'+(item.status?badge(item.status):'')+'</div>';
  html+='<div class="dc-body">';
  fields.forEach(function(f){
    if(f!==titleField&&item[f]!==undefined){
      html+='<div class="dc-field">'+f+'：<span>'+item[f]+'</span></div>';
    }
  });
  html+='</div>';
  if(item.amount||item.value||item.price){
    var val=item.amount||item.value||item.price;
    html+='<div class="dc-footer"><div class="dc-field">金额：<span>¥'+val+'</span></div><div class="dc-field">'+(item.date||'')+'</div></div>';
  }
  html+='</div>';
  return html;
}

function filterList(input,dataKey){
  var q=input.value.toLowerCase();
  var data=MOCK[dataKey]||[];
  var container=document.getElementById('listContainer');
  if(!container)return;
  var filtered=data.filter(function(d){
    return Object.values(d).some(function(v){return String(v).toLowerCase().indexOf(q)>=0});
  });
  var fields=Object.keys(data[0]||{}).slice(0,5);
  var html='';
  filtered.forEach(function(item){html+=renderCard(item,fields,fields[0])});
  container.innerHTML=html||'<div class="empty"><div class="em-icon">🔍</div><div class="em-text">未找到匹配数据</div></div>';
}

function filterStatus(chip,dataKey,status){
  var chips=document.querySelectorAll('.filter-chip');
  chips.forEach(function(c){c.classList.remove('active')});
  chip.classList.add('active');
  var data=MOCK[dataKey]||[];
  var container=document.getElementById('listContainer');
  if(!container)return;
  var filtered=status==='all'?data:data.filter(function(d){return d.status===status});
  var fields=Object.keys(data[0]||{}).slice(0,5);
  var html='';
  filtered.forEach(function(item){html+=renderCard(item,fields,fields[0])});
  container.innerHTML=html||'<div class="empty"><div class="em-icon">📋</div><div class="em-text">暂无数据</div></div>';
}

function filterPatients(input,fullAccess){
  var q=input.value.toLowerCase();
  var data=MOCK.patients.filter(function(p){
    return p.name.toLowerCase().indexOf(q)>=0||p.diagnosis.indexOf(q)>=0||p.doctor.indexOf(q)>=0||p.implantModel.toLowerCase().indexOf(q)>=0;
  });
  var container=document.getElementById('patientList');
  if(!container)return;
  var html='';
  data.forEach(function(p){html+=renderPatientCard(p,fullAccess)});
  container.innerHTML=html||'<div class="empty"><div class="em-icon">🔍</div><div class="em-text">未找到患者</div></div>';
}

function renderFinance(content){
  var income=MOCK.finance.filter(function(f){return f.type==='income'}).reduce(function(s,f){return s+f.amount},0);

  var html='';
  html+='<div class="stats-grid">';

  html+='<div class="stat-card"><div class="sc-icon" style="background:#e8f4fd">📈</div><div><div class="sc-value">¥'+(income-expense)+'</div><div class="sc-label">净利润</div></div></div>';
  html+='<div class="stat-card"><div class="sc-icon" style="background:#fef5e7">📊</div><div><div class="sc-value">'+MOCK.finance.length+'</div><div class="sc-label">交易笔数</div></div></div>';

  html+='<div class="card-list">';

    html+='<div class="data-card">';
    html+='<div class="dc-header"><div class="dc-title">'+f.category+'</div><span class="badge '+(f.type==='income'?'badge-success':'badge-danger')+'">'+(f.type==='income'?'收入':'支出')+'</span></div>';

    html+='<div class="dc-footer"><div class="dc-field">金额：<span>¥'+f.amount+'</span></div></div>';
    html+='</div>';
  });
  html+='</div>';
  content.innerHTML=html;
}

function renderReports(content){
  var html='<div class="section"><div class="section-title">营收趋势</div></div>';
  html+='<div class="chart" style="display:flex;align-items:flex-end;gap:6px;height:120px;padding:12px;background:#fff;border-radius:10px;margin:0 12px">';
  var months=['1月','2月','3月','4月','5月','6月','7月','8月'];
  var values=[45,52,48,61,58,67,72,89];
  var max=Math.max.apply(null,values);
  months.forEach(function(m,i){
    var h=Math.round(values[i]/max*100);
    html+='<div class="chart-bar" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">';
    html+='<div style="width:100%;border-radius:4px 4px 0 0;min-height:4px;height:'+h+'px;background:#1abc9c"></div>';
    html+='<div style="font-size:10px;color:#7f8c8d">'+m+'</div>';
    html+='</div>';
  });
  html+='</div>';
  html+='<div class="section" style="margin-top:12px"><div class="section-title">分类统计</div></div>';
  html+='<div class="card-list">';
  html+='<div class="data-card"><div class="dc-header"><div class="dc-title">种植卡收入</div></div><div class="dc-body"><div class="dc-field">金额：<span>¥58,600</span></div></div></div>';
  html+='<div class="data-card"><div class="dc-header"><div class="dc-title">佣金收入</div></div><div class="dc-body"><div class="dc-field">金额：<span>¥12,500</span></div></div></div>';
  html+='<div class="data-card"><div class="dc-header"><div class="dc-title">采购支出</div></div><div class="dc-body"><div class="dc-field">金额：<span>¥15,600</span></div></div></div>';
  html+='</div>';
  content.innerHTML=html;
}

function renderReview(content){
  var pending=MOCK.clinics.filter(function(c){return c.status==='pending'}).concat(MOCK.pharmacies.filter(function(p){return p.status==='pending'}));
  var html='';
  if(pending.length===0){
    html='<div class="empty"><div class="em-icon">✅</div><div class="em-text">暂无待审核申请</div></div>';
  }else{
    html+='<div class="card-list">';
    pending.forEach(function(item){
      html+='<div class="data-card">';
      html+='<div class="dc-header"><div class="dc-title">'+item.name+'</div>'+badge('pending')+'</div>';
      html+='<div class="dc-body"><div class="dc-field">负责人：<span>'+item.manager+'</span></div><div class="dc-field">电话：<span>'+item.phone+'</span></div><div class="dc-field">地址：<span>'+item.address+'</span></div></div>';
      html+='<div class="dc-footer"><button class="btn-primary" style="padding:6px 16px;border-radius:6px" onclick="approveItem('+item.id+',\''+item.name+'\')">通过</button><button class="btn-danger" style="padding:6px 16px;border-radius:6px" onclick="rejectItem('+item.id+',\''+item.name+'\')">拒绝</button></div>';
      html+='</div>';
    });
    html+='</div>';
  }
  content.innerHTML=html;
}

function approveItem(id,name){
  showConfirm('确认通过 '+name+' 的注册申请？',function(){
    showToast('已通过审核');

}

function rejectItem(id,name){

}

// ==================== Init ====================
function init(){
  var btn=document.getElementById('loginBtn');
  btn.addEventListener('click',function(e){e.preventDefault();doLogin()});
  btn.addEventListener('touchend',function(e){e.preventDefault();doLogin()});
  document.getElementById('loginPassword').addEventListener('keypress',function(e){
    if(e.key==='Enter'){e.preventDefault();doLogin()}
  });
  
  if(token&&userInfo&&currentPort){
    showMain();
  }else if(token&&userInfo){
    showPortSelect();
  }else{
    showLogin();
  }
}

init();
