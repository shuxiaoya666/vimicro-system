<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>小唯管理系统 - 管理端</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#1abc9c;--primary-dark:#16a085;--primary-light:#e8f8f5;
  --blue:#3498db;--blue-dark:#2980b9;
  --orange:#f39c12;--orange-dark:#e67e22;
  --purple:#8e44ad;--purple-light:#f5eef7;
  --teal:#0097a7;
  --danger:#e74c3c;--success:#27ae60;--warning:#f39c12;
  --bg:#f0f2f5;--card-bg:#fff;--text:#2c3e50;--text-muted:#7f8c8d;--border:#ecf0f1;
  --shadow:0 1px 4px rgba(0,0,0,.06);
}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
button{border:none;outline:none;cursor:pointer;font-family:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:14px;outline:none}
::-webkit-scrollbar{display:none}

/* Splash */
.splash{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#1abc9c,#16a085);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.splash.up{transform:translateY(-100%);pointer-events:none}
.splash-logo{width:80px;height:80px;background:rgba(255,255,255,.2);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:40px;margin-bottom:16px;animation:bounce 1s ease}
.splash-title{color:#fff;font-size:24px;font-weight:700;margin-bottom:4px}
.splash-sub{color:rgba(255,255,255,.8);font-size:13px;margin-bottom:24px}
.splash-enter{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;animation:bounce 1.5s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0);opacity:.8}50%{transform:translateY(-10px);opacity:1}}

/* Login */
.login{position:fixed;inset:0;background:linear-gradient(135deg,#1abc9c,#16a085);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;z-index:9000;transition:opacity .3s}
.login-card{background:#fff;border-radius:16px;padding:28px 24px;width:100%;max-width:340px;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.login-logo{text-align:center;margin-bottom:20px}
.login-logo .ll-icon{width:56px;height:56px;background:linear-gradient(135deg,#1abc9c,#16a085);border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-size:28px;color:#fff;margin-bottom:8px}
.login-logo .ll-title{font-size:18px;font-weight:700;color:var(--text)}
.login-logo .ll-sub{font-size:12px;color:var(--text-muted);margin-top:2px}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:4px}
.login-field input{width:100%;height:42px;border:1px solid #ddd;border-radius:8px;padding:0 12px;font-size:14px;transition:border-color .2s}
.login-field input:focus{border-color:var(--primary)}
.login-row{display:flex;gap:8px;align-items:center}
.login-row input{flex:1}
.captcha-box{width:90px;height:42px;border:1px solid #ddd;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;font-weight:700;font-style:italic;letter-spacing:2px;background:var(--primary-light);color:var(--primary-dark);user-select:none}
.login-btn{width:100%;height:44px;background:linear-gradient(135deg,#1abc9c,#16a085);color:#fff;border-radius:10px;font-size:15px;font-weight:600;margin-top:6px;transition:opacity .2s}
.login-btn:disabled{opacity:.6}
.login-btn:active{opacity:.85}
.login-hint{text-align:center;margin-top:14px;font-size:12px;color:var(--text-muted)}
.login-hint b{color:var(--primary-dark)}
.api-settings{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.api-toggle{font-size:12px;color:var(--text-muted);cursor:pointer;text-align:center}
.api-config{display:none;margin-top:10px}
.api-config.show{display:block}
.api-config input{width:100%;height:36px;border:1px solid #ddd;border-radius:6px;padding:0 8px;font-size:12px}
.api-config .api-save{margin-top:6px;width:100%;height:32px;background:var(--primary);color:#fff;border-radius:6px;font-size:12px}

/* Port selection */
.port-select{position:fixed;inset:0;background:var(--bg);z-index:8500;display:flex;flex-direction:column;transition:opacity .3s}
.port-select-header{background:linear-gradient(135deg,#1abc9c,#16a085);padding:40px 20px 30px;text-align:center}
.port-select-header h2{color:#fff;font-size:20px;margin-bottom:4px}
.port-select-header p{color:rgba(255,255,255,.8);font-size:13px}
.port-grid{padding:20px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.port-card{background:#fff;border-radius:12px;padding:16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
.port-card:active{transform:scale(.98)}
.port-card .pc-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.port-card .pc-info{flex:1}
.port-card .pc-name{font-size:15px;font-weight:600}
.port-card .pc-desc{font-size:12px;color:var(--text-muted);margin-top:2px}
.port-card .pc-arrow{color:#ccc;font-size:18px}
.port-card.disabled{opacity:.4;pointer-events:none}
.port-card.disabled .pc-desc{color:var(--danger)}

/* Main app */
.app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
.app.hidden{display:none}

/* Topbar */
.topbar{height:48px;background:var(--primary);display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0;z-index:100}
.topbar.port-platform{background:linear-gradient(90deg,#1abc9c,#16a085)}
.topbar.port-clinic{background:linear-gradient(90deg,#3498db,#2980b9)}
.topbar.port-dealer{background:linear-gradient(90deg,#f39c12,#e67e22)}
.topbar.port-pharmacy{background:linear-gradient(90deg,#8e44ad,#9b59b6)}
.topbar.port-factory{background:linear-gradient(90deg,#0097a7,#00b8d4)}
.topbar-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;cursor:pointer;flex-shrink:0}
.topbar-title{flex:1;color:#fff;font-size:16px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-port-btn{background:rgba(255,255,255,.2);border-radius:14px;padding:3px 10px;font-size:11px;color:#fff;display:flex;align-items:center;gap:3px;cursor:pointer}

/* Sidebar menu */
.sidebar{position:fixed;top:0;left:0;bottom:0;width:260px;background:#fff;z-index:200;transform:translateX(-100%);transition:transform .3s;display:flex;flex-direction:column}
.sidebar.show{transform:translateX(0)}
.sidebar-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:150;opacity:0;pointer-events:none;transition:opacity .3s}
.sidebar-mask.show{opacity:1;pointer-events:auto}
.sidebar-header{padding:20px 16px;background:linear-gradient(135deg,#1abc9c,#16a085);color:#fff;flex-shrink:0}
.sidebar-header .sh-avatar{width:44px;height:44px;background:rgba(255,255,255,.25);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:8px}
.sidebar-header .sh-name{font-size:15px;font-weight:600}
.sidebar-header .sh-role{font-size:12px;opacity:.8;margin-top:2px}
.sidebar-body{flex:1;overflow-y:auto;padding:8px 0}
.sidebar-group{margin-bottom:8px}
.sidebar-group-title{padding:8px 16px 4px;font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:14px;cursor:pointer;transition:background .15s}
.sidebar-item:active,.sidebar-item.active{background:var(--primary-light);color:var(--primary-dark)}
.sidebar-item .si-icon{font-size:18px;width:24px;text-align:center}

/* Content */
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:60px}

/* Page */
.page{display:none}
.page.active{display:block}

/* Stats cards */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.stat-card{background:#fff;border-radius:10px;padding:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px}
.stat-card .sc-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.stat-card .sc-info{flex:1;min-width:0}
.stat-card .sc-value{font-size:20px;font-weight:700;line-height:1.2}
.stat-card .sc-label{font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Quick grid */
.qg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 12px 12px}
.qg-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;background:#fff;border-radius:10px;cursor:pointer;transition:transform .15s}
.qg-item:active{transform:scale(.95)}
.qg-item .qg-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.qg-item .qg-name{font-size:11px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* Section */
.section{padding:12px}
.section-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.section-title .st-more{font-size:11px;color:var(--primary);font-weight:400;cursor:pointer}

/* Card list */
.card-list{display:flex;flex-direction:column;gap:8px;padding:0 12px}
.data-card{background:#fff;border-radius:10px;padding:12px;box-shadow:var(--shadow)}
.data-card .dc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.data-card .dc-title{font-size:14px;font-weight:600}
.data-card .dc-sub{font-size:12px;color:var(--text-muted);margin-top:2px}
.data-card .dc-body{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px}
.data-card .dc-field{font-size:12px}
.data-card .dc-field span{color:var(--text-muted)}
.data-card .dc-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}

/* Badge */
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.badge-success{background:#e8f8f0;color:#27ae60}
.badge-warning{background:#fef5e7;color:#f39c12}
.badge-danger{background:#fdeaea;color:#e74c3c}
.badge-info{background:#e8f4fd;color:#3498db}
.badge-muted{background:#f5f5f5;color:#95a5a6}
.badge-purple{background:#f5eef7;color:#8e44ad}

/* Filter bar */
.filter-bar{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;flex-shrink:0}
.filter-chip{padding:4px 12px;border-radius:14px;font-size:12px;white-space:nowrap;cursor:pointer;background:#fff;border:1px solid var(--border);color:var(--text-muted)}
.filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* Search */
.search-bar{padding:8px 12px}
.search-bar input{width:100%;height:36px;border:1px solid var(--border);border-radius:18px;padding:0 16px;font-size:13px;background:#fff}

/* Empty */
.empty{text-align:center;padding:40px 20px;color:var(--text-muted)}
.empty .em-icon{font-size:48px;margin-bottom:8px;opacity:.3}
.empty .em-text{font-size:13px}

/* Bottom tabbar */
.tabbar{position:fixed;bottom:0;left:0;right:0;height:56px;background:#fff;display:flex;border-top:1px solid var(--border);z-index:100}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--text-muted);transition:color .2s}
.tab.active{color:var(--primary)}
.tab .t-icon{font-size:20px}
.tab .t-name{font-size:10px}

/* Subpage */
.subpage{position:fixed;inset:0;background:var(--bg);z-index:300;display:none;flex-direction:column}
.subpage.active{display:flex}
.subpage-header{height:48px;display:flex;align-items:center;padding:0 12px;gap:8px;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0}
.subpage-header .sh-back{font-size:20px;cursor:pointer;color:var(--text);width:32px}
.subpage-header .sh-title{flex:1;font-size:16px;font-weight:600;text-align:center}
.subpage-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:400;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:#fff;width:100%;max-width:500px;border-radius:16px 16px 0 0;max-height:85vh;overflow-y:auto;animation:slideUp .3s}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:1}
.modal-header .mh-title{font-size:16px;font-weight:600}
.modal-header .mh-close{font-size:22px;cursor:pointer;color:var(--text-muted)}
.modal-body{padding:16px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:4px}
.form-group label .req{color:var(--danger)}
.form-group input,.form-group select,.form-group textarea{width:100%;height:40px;border:1px solid #ddd;border-radius:8px;padding:0 12px;font-size:13px}
.form-group textarea{height:80px;padding:8px 12px;resize:none}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary)}
.form-actions{display:flex;gap:8px;padding-top:8px}
.form-actions button{flex:1;height:42px;border-radius:8px;font-size:14px;font-weight:600}
.btn-primary{background:var(--primary);color:#fff}
.btn-secondary{background:#f5f5f5;color:var(--text)}
.btn-danger{background:var(--danger);color:#fff}

/* Toast */
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:9999;opacity:0;pointer-events:none;transition:opacity .3s;max-width:80%;text-align:center}
.toast.show{opacity:1}

/* Confirm */
.confirm-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:center;justify-content:center}
.confirm-bg.show{display:flex}
.confirm-box{background:#fff;border-radius:12px;padding:20px;width:280px;text-align:center}
.confirm-box .cb-msg{font-size:14px;margin-bottom:16px}
.confirm-box .cb-actions{display:flex;gap:8px}
.confirm-box .cb-actions button{flex:1;height:38px;border-radius:8px;font-size:14px}
.confirm-box .cb-ok{background:var(--primary);color:#fff}
.confirm-box .cb-cancel{background:#f5f5f5;color:var(--text)}

/* Table (simple) */
.mini-table{width:100%;font-size:12px}
.mini-table th{text-align:left;padding:6px 8px;background:var(--primary-light);color:var(--primary-dark);font-weight:600;white-space:nowrap}
.mini-table td{padding:6px 8px;border-bottom:1px solid var(--border)}
.mini-table tr:nth-child(even){background:#fafbfc}

/* Progress timeline */
.timeline{padding:12px}
.timeline-item{display:flex;gap:10px;padding-bottom:16px;position:relative}
.timeline-item:last-child{padding-bottom:0}
.timeline-item::before{content:'';position:absolute;left:15px;top:28px;bottom:0;width:2px;background:var(--border)}
.timeline-item:last-child::before{display:none}
.timeline-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;z-index:1}
.timeline-dot.done{background:#e8f8f0;color:#27ae60}
.timeline-dot.pending{background:#fef5e7;color:#f39c12}
.timeline-content{flex:1}
.timeline-content .tc-title{font-size:13px;font-weight:600}
.timeline-content .tc-desc{font-size:12px;color:var(--text-muted);margin-top:2px}
.timeline-content .tc-time{font-size:11px;color:var(--text-muted);margin-top:2px}

/* Pagination */
.pagination{display:flex;justify-content:center;gap:4px;padding:12px}
.pagination button{min-width:32px;height:32px;border:1px solid var(--border);border-radius:6px;background:#fff;font-size:12px;color:var(--text);cursor:pointer}
.pagination button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pagination button:disabled{opacity:.4;cursor:not-allowed}

/* Settings */
.settings-group{margin:12px;background:#fff;border-radius:10px;overflow:hidden}
.settings-item{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.settings-item:last-child{border-bottom:none}
.settings-item .si-label{font-size:14px}
.settings-item .si-value{font-size:13px;color:var(--text-muted)}
.settings-item:active{background:#f9f9f9}

/* Chart bars */
.chart{display:flex;align-items:flex-end;gap:6px;height:120px;padding:12px;background:#fff;border-radius:10px;margin:0 12px}
.chart-bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.chart-bar .cb-bar{width:100%;border-radius:4px 4px 0 0;min-height:4px;transition:height .5s;background:var(--primary)}
.chart-bar .cb-label{font-size:10px;color:var(--text-muted);white-space:nowrap}

/* Pie chart container */
.pie-container{display:flex;align-items:center;gap:16px;padding:12px;background:#fff;border-radius:10px;margin:0 12px}
.pie-chart{width:100px;height:100px;border-radius:50%;flex-shrink:0;position:relative}
.pie-legend{flex:1;display:flex;flex-direction:column;gap:6px}
.pie-legend-item{display:flex;align-items:center;gap:6px;font-size:12px}
.pie-legend-item .pl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

.hidden{display:none!important}
</style>
</head>
<body>

<!-- Login -->
<div class="login" id="loginPage">
  <div class="login-card">
    <div class="login-logo">
      <div class="ll-icon">🦷</div>
      <div class="ll-title">小唯管理系统</div>
      <div class="ll-sub">管理端登录</div>
    </div>
    <div class="login-field">
      <label>账号</label>
      <input type="text" id="loginAccount" placeholder="请输入账号" value="admin">
    </div>
    <div class="login-field">
      <label>密码</label>
      <input type="password" id="loginPassword" placeholder="请输入密码" value="123456">
    </div>
    <button class="login-btn" id="loginBtn" type="button">登 录</button>
<script>
(function(){
  var btn=document.getElementById('loginBtn');
  var acc=document.getElementById('loginAccount');
  var pwd=document.getElementById('loginPassword');
  function handleLogin(){
    var a=acc.value.trim(),p=pwd.value.trim();
    if(!a||!p){alert('请输入账号和密码');return}
    btn.disabled=true;btn.textContent='登录中...';
    var accounts={
      admin:{password:'123456',name:'超级管理员',avatar:'管',role:'super',ports:['platform','clinic','dealer','pharmacy','factory']},
      clinic:{password:'123456',name:'李医生',avatar:'李',role:'clinic',ports:['clinic']},
      dealer:{password:'123456',name:'张经理',avatar:'张',role:'dealer',ports:['dealer']},
      pharmacy:{password:'123456',name:'周店长',avatar:'周',role:'pharmacy',ports:['pharmacy']},
      factory:{password:'123456',name:'孙厂长',avatar:'孙',role:'factory',ports:['factory']}
    };
    var user=accounts[a];
    if(user&&user.password===p){
      localStorage.setItem('adminToken','local_'+a+'_'+Date.now());
      localStorage.setItem('adminUserInfo',JSON.stringify({id:0,name:user.name,avatar:user.avatar,role:user.role,ports:user.ports,account:a}));
      localStorage.setItem('adminPort',user.ports[0]);
      location.reload();
    }else{
      btn.disabled=false;btn.textContent='登 录';
      alert('账号或密码错误');
    }
  }
  btn.addEventListener('click',function(e){e.preventDefault();handleLogin()});
  btn.addEventListener('touchend',function(e){e.preventDefault();handleLogin()});
  pwd.addEventListener('keypress',function(e){if(e.key==='Enter'){e.preventDefault();handleLogin()}});
})();
</script>
    <div class="login-hint">测试账号: <b>admin</b> / <b>clinic</b> / <b>dealer</b> / <b>pharmacy</b> / <b>factory</b> 密码: <b>123456</b></div>
    <div class="api-settings">
      <div class="api-toggle" onclick="toggleApiConfig()">⚙ API地址设置</div>
      <div class="api-config" id="apiConfigBox">
        <input type="text" id="apiBaseInput" placeholder="https://xxx.loca.lt/api">
        <button class="api-save" onclick="saveApiBase()">保存</button>
      </div>
    </div>
  </div>
</div>

<!-- Port selection -->
<div class="port-select hidden" id="portSelectPage">
  <div class="port-select-header">
    <h2>选择管理端口</h2>
    <p id="portSelectUser"></p>
  </div>

// ==================== API ====================
function apiRequest(url,method,data){
  return new Promise(function(resolve,reject){
    var xhr=new XMLHttpRequest();
    xhr.open(method||(data?'POST':'GET'),API_BASE+url);
    xhr.timeout=5000;
    if(data){xhr.setRequestHeader('Content-Type','application/json')}
    if(token&&token.indexOf('local_')!==0&&token!=='demo'){
      xhr.setRequestHeader('Authorization','Bearer '+token);
    }
    xhr.onload=function(){
      if(xhr.status>=200&&xhr.status<300){
        try{resolve(JSON.parse(xhr.responseText))}catch(e){reject('parse')}
      }else if(xhr.status===401){
        localStorage.removeItem('adminToken');localStorage.removeItem('adminUserInfo');
        token=null;userInfo=null;showLogin();reject('auth');
      }else{reject(xhr.statusText)}
    };
    xhr.ontimeout=function(){reject('timeout')};
    xhr.onerror=function(){reject('network')};
    xhr.send(data?JSON.stringify(data):null);
  });
}

function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show')},2000);
}

function showConfirm(msg,cb){
  document.getElementById('confirmMsg').textContent=msg;
  document.getElementById('confirmBg').classList.add('show');
  document.getElementById('confirmOkBtn').onclick=function(){
    document.getElementById('confirmBg').classList.remove('show');
    cb();
  };
}

// ==================== Captcha ====================
function generateCaptcha(){
  var chars='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  var s='';
  for(var i=0;i<4;i++){s+=chars[Math.floor(Math.random()*chars.length)]}
  document.getElementById('captchaBox').textContent=s;
  return s;
}

// ==================== Login ====================
function showLogin(){
  document.getElementById('loginPage').classList.remove('hidden');
  document.getElementById('mainApp').classList.add('hidden');
  document.getElementById('portSelectPage').classList.add('hidden');
}

function toggleApiConfig(){
  document.getElementById('apiConfigBox').classList.toggle('show');
  document.getElementById('apiBaseInput').value=API_BASE;
}

function saveApiBase(){
  var v=document.getElementById('apiBaseInput').value.trim();
  if(!v){showToast('请输入API地址');return}
  if(v.indexOf('/api')===-1){v=v.replace(/\/$/,'')+'/api'}
  API_BASE=v;localStorage.setItem('apiBase',v);
  showToast('API地址已保存');
}

function doLogin(){
  var a=document.getElementById('loginAccount').value.trim();
  var p=document.getElementById('loginPassword').value.trim();
  if(!a||!p){showToast('请输入账号和密码');return}
  
  var btn=document.getElementById('loginBtn');
  btn.disabled=true;btn.textContent='登录中...';
  
  apiRequest('/auth/login','POST',{account:a,password:p}).then(function(res){
    token=res.token;userInfo=res.user;
    localStorage.setItem('adminToken',token);
    localStorage.setItem('adminUserInfo',JSON.stringify(userInfo));
    btn.disabled=false;btn.textContent='登 录';
    showPortSelect();
  }).catch(function(){
    var acc=LOCAL_ACCOUNTS[a];
    if(acc&&acc.password===p){
      token='local_'+a+'_'+Date.now();
      userInfo={id:0,name:acc.name,avatar:acc.avatar,role:acc.role,ports:acc.ports,account:a};
      localStorage.setItem('adminToken',token);
      localStorage.setItem('adminUserInfo',JSON.stringify(userInfo));
      btn.disabled=false;btn.textContent='登 录';
      showPortSelect();
      showToast('登录成功（本地模式）');
    }else{
      btn.disabled=false;btn.textContent='登 录';
      showToast('账号或密码错误');
    }
  });
}

function showPortSelect(){

  ps.classList.remove('hidden');

  currentPort=port;

// ==================== Main App ====================
function showMain(){
  var app=document.getElementById('mainApp');
  app.classList.remove('hidden');
  
  // Update topbar
  var tb=document.getElementById('topbar');
  tb.className='topbar port-'+currentPort;
  document.getElementById('topbarPortName').textContent=PORT_CONFIG[currentPort].name.replace('端','');
  
  // Update sidebar header
  var sh=document.getElementById('sidebarHeader');
  sh.style.background='linear-gradient(135deg,'+PORT_CONFIG[currentPort].color+','+PORT_CONFIG[currentPort].color+'dd)';
  document.getElementById('sidebarAvatar').textContent=userInfo?userInfo.avatar:'?';
  document.getElementById('sidebarName').textContent=userInfo?userInfo.name:'';
  document.getElementById('sidebarRole').textContent=PORT_CONFIG[currentPort].name;
  
  // Build sidebar
  buildSidebar();
  
  // Default to home
  currentPage='home';
  navigateTo('home');
  switchTab('home');
}

function buildSidebar(){
  var menus=PORT_MENUS[currentPort]||[];
  var html='';
  menus.forEach(function(group){
    html+='<div class="sidebar-group">';
    html+='<div class="sidebar-group-title">'+group.group+'</div>';
    group.items.forEach(function(item){
      html+='<div class="sidebar-item'+(currentPage===item.key?' active':'')}" onclick="navigateTo(\''+item.key+'\')">';
      html+='<span class="si-icon">'+item.icon+'</span><span>'+item.name+'</span>';
      html+='</div>';
    });
    html+='</div>';
  });
  document.getElementById('sidebarBody').innerHTML=html;
}

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('show');
  document.getElementById('sidebarMask').classList.toggle('show');
}

function navigateTo(page){
  currentPage=page;
  toggleSidebar();
  
  // Update title
  var menus=PORT_MENUS[currentPort]||[];
  var title='首页';
  for(var i=0;i<menus.length;i++){
    for(var j=0;j<menus[i].items.length;j++){
      if(menus[i].items[j].key===page){title=menus[i].items[j].name;break}
    }
  }
  if(page==='home')title='首页';
  document.getElementById('topbarTitle').textContent=title;
  
  // Update active in sidebar
  var items=document.querySelectorAll('.sidebar-item');
  items.forEach(function(it){it.classList.remove('active')});
  
  // Render page
  renderPage(page);
}

// ==================== Tab Switching ====================
function switchTab(tab){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  event.currentTarget.classList.add('active');
  
  if(tab==='home'){navigateTo('home')}
  else if(tab==='manage'){renderManageGrid()}
  else if(tab==='medical'){renderMedicalTab()}
  else if(tab==='finance'){renderFinanceTab()}
  else if(tab==='mine'){renderMineTab()}
}

function renderManageGrid(){
  var menus=PORT_MENUS[currentPort]||[];
  var items=[];
  menus.forEach(function(g){
    if(g.group!=='概览'&&g.group!=='系统'&&g.group!=='财务'&&g.group!=='病历'&&g.group!=='病历中心'&&g.group!=='沟通'){
      g.items.forEach(function(it){items.push(it)});
    }
  });
  
  if(items.length===0){
    document.getElementById('contentArea').innerHTML='<div class="empty"><div class="em-icon">📋</div><div class="em-text">当前端口暂无管理功能</div></div>';
    return;
  }
  
  var html='<div class="qg" style="padding-top:12px">';
  items.forEach(function(it){
    html+='<div class="qg-item" onclick="navigateTo(\''+it.key+'\')">';
    html+='<div class="qg-icon" style="background:'+PORT_CONFIG[currentPort].color+'15">'+it.icon+'</div>';
    html+='<div class="qg-name">'+it.name+'</div>';
    html+='</div>';
  });
  html+='</div>';
  
  // Also show recent data summary
  html+='<div class="section"><div class="section-title">最近数据</div></div>';
  html+='<div class="card-list">';
  items.slice(0,3).forEach(function(it){
    var data=MOCK[it.key]||[];
    if(data.length>0){
      var d=data[0];
      var fields=Object.keys(d).slice(0,3);
      html+='<div class="data-card" onclick="navigateTo(\''+it.key+'\')">';
      html+='<div class="dc-header"><div class="dc-title">'+it.name+' ('+data.length+')</div><span class="badge badge-info">查看全部</span></div>';

      html+='</div></div>';
    }
  });
  html+='</div>';

  document.getElementById('topbarTitle').textContent='管理';

// ==================== CRUD Page ====================
function renderCRUDPage(entity){
  var config=CRUD_CONFIG[entity];
  if(!config){return}
  
  var data=MOCK[entity]||[];
  var html='';
  
  // Search bar
  html+='<div class="search-bar"><input type="text" id="searchInput" placeholder="搜索'+config.title+'..." oninput="filterCRUD(\''+entity+'\')"></div>';
  
  // Status filter
  var statusOptions=getStatusOptions(entity);
  if(statusOptions.length>0){
    html+='<div class="filter-bar" id="filterBar">';
    html+='<div class="filter-chip active" onclick="setCRUDFilter(this,\''+entity+'\',\'\')">全部</div>';
    statusOptions.forEach(function(opt){
      html+='<div class="filter-chip" onclick="setCRUDFilter(this,\''+entity+'\',\''+opt.value+'\')">'+opt.label+'</div>';
    });
    html+='</div>';
  }
  
  // Data list
  html+='<div class="card-list" id="crudList">';
  html+=renderCRUDCards(entity,data);
  html+='</div>';
  
  // Add button
  if(entity!=='factories'&&entity!=='regreview'&&entity!=='notifications'&&entity!=='roles'){
    html+='<div style="padding:12px;text-align:center">';
    html+='<button class="btn-primary" style="width:100%;height:44px;border-radius:10px" onclick="openCRUDForm(\''+entity+'\')">+ 新增'+config.title.replace('管理','').replace('明细','')</button>';
    html+='</div>';
  }
  
  document.getElementById('contentArea').innerHTML=html;
}

function getStatusOptions(entity){
  var opts=[];
  if(entity==='clinics'||entity==='pharmacies'||entity==='dealers'){
    opts=[{value:'active',label:'正常'},{value:'pending',label:'待审核'},{value:'rejected',label:'已拒绝'}];
  }else if(entity==='cards'){
    opts=[{value:'active',label:'正常'},{value:'used',label:'已使用'}];
  }else if(entity==='orders'||entity==='purchase'){
    opts=[{value:'pending',label:'待接单'},{value:'processing',label:'加工中'},{value:'shipped',label:'已发货'},{value:'received',label:'已签收'}];
  }else if(entity==='transactions'){
    opts=[{value:'收入',label:'收入'},{value:'支出',label:'支出'}];
  }else if(entity==='withdrawals'){
    opts=[{value:'pending',label:'待审核'},{value:'completed',label:'已到账'}];
  }else if(entity==='settlements'){
    opts=[{value:'pending',label:'待结算'},{value:'completed',label:'已结算'}];
  }else if(entity==='registrations'){
    opts=[{value:'pending',label:'待审核'},{value:'approved',label:'已通过'},{value:'rejected',label:'已拒绝'}];
  }else if(entity==='notifications'){
    opts=[];
  }else if(entity==='verifyRecords'){
    opts=[{value:'done',label:'已完成'},{value:'pending',label:'待执行'}];
  }else if(entity==='implants'){
    opts=[{value:'active',label:'充足'},{value:'low',label:'不足'}];
  }else if(entity==='quality'){
    opts=[{value:'passed',label:'合格'},{value:'partial',label:'部分合格'}];
  }
  return opts;
}

function renderCRUDCards(entity,data){
  if(!data||data.length===0){
    return '<div class="empty"><div class="em-icon">📭</div><div class="em-text">暂无数据</div></div>';
  }
  
  var config=CRUD_CONFIG[entity];
  var html='';
  data.forEach(function(item){
    html+='<div class="data-card">';
    // Header
    var titleField=config.columns[0].key;
    html+='<div class="dc-header"><div class="dc-title">'+item[titleField]+'</div>';
    if(item.status){
      html+='<span class="badge '+getStatusBadgeClass(item.status)+'">'+getStatusLabel(entity,item.status)+'</span>';
    }
    html+='</div>';
    
    // Body fields
    html+='<div class="dc-body">';
    config.columns.slice(1,5).forEach(function(col){
      if(item[col.key]!==undefined&&item[col.key]!==''){
        html+='<div class="dc-field"><span>'+col.label+':</span> '+item[col.key]+'</div>';
      }
    });
    html+='</div>';
    
    // Actions
    html+='<div class="dc-footer">';
    if(entity==='registrations'&&item.status==='pending'){
      html+='<button class="btn-primary" style="height:30px;padding:0 12px;border-radius:6px;font-size:12px" onclick="reviewRegistration('+item.id+',\'approved\')">通过</button>';
      html+='<button class="btn-danger" style="height:30px;padding:0 12px;border-radius:6px;font-size:12px" onclick="reviewRegistration('+item.id+',\'rejected\')">拒绝</button>';
    }else if(entity==='factories'){
      html+='<span style="font-size:12px;color:var(--text-muted)">月产能: '+item.capacity+'件</span>';
    }else{
      html+='<div style="display:flex;gap:8px">';
      html+='<button class="btn-secondary" style="height:30px;padding:0 12px;border-radius:6px;font-size:12px" onclick="openCRUDForm(\''+entity+'\','+item.id+')">编辑</button>';
      if(entity!=='roles'&&entity!=='notifications'){
        html+='<button class="btn-danger" style="height:30px;padding:0 12px;border-radius:6px;font-size:12px" onclick="deleteCRUDItem(\''+entity+'\','+item.id+')">删除</button>';
      }
      html+='</div>';
    }
    html+='</div>';
    
    // Factory stages
    if(entity==='factories'&&item.stages){
      html+='<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">';
      html+='<div style="font-size:12px;color:var(--text-muted);margin-bottom:6px">生产流程</div>';
      html+='<div style="display:flex;flex-wrap:wrap;gap:4px">';
      item.stages.forEach(function(s,i){
        html+='<span class="badge badge-info" style="font-size:10px">'+(i+1)+'. '+s+'</span>';
      });
      html+='</div></div>';
    }
    
    html+='</div>';
  });
  return html;
}

function getStatusBadgeClass(status){
  var map={
    active:'badge-success',pending:'badge-warning',rejected:'badge-danger',
    used:'badge-muted',expired:'badge-danger',
    completed:'badge-success',processing:'badge-info',shipped:'badge-info',received:'badge-success',
    ordered:'badge-info',received:'badge-success',
    done:'badge-success',
    low:'badge-warning',out:'badge-danger',
    passed:'badge-success',partial:'badge-warning',failed:'badge-danger',
    approved:'badge-success',
    收入:'badge-success',支出:'badge-danger'
  };
  return map[status]||'badge-muted';
}

function getStatusLabel(entity,status){
  var map={
    active:'正常',pending:'待审核',rejected:'已拒绝',
    used:'已使用',expired:'已过期',
    completed:'已完成',processing:'加工中',shipped:'已发货',received:'已签收',
    ordered:'已下单',
    done:'已完成',
    low:'不足',out:'缺货',
    passed:'合格',partial:'部分合格',failed:'不合格',
    approved:'已通过',
    收入:'收入',支出:'支出'
  };
  return map[status]||status;
}

// CRUD filter state
var crudFilter='';

function setCRUDFilter(el,entity,status){
  document.querySelectorAll('#filterBar .filter-chip').forEach(function(c){c.classList.remove('active')});
  el.classList.add('active');
  crudFilter=status;
  filterCRUD(entity);
}

function filterCRUD(entity){
  var search=document.getElementById('searchInput').value.toLowerCase();
  var data=MOCK[entity]||[];
  var filtered=data.filter(function(item){
    var matchSearch=true;
    if(search){
      matchSearch=JSON.stringify(item).toLowerCase().indexOf(search)>=0;
    }
    var matchFilter=true;
    if(crudFilter){
      if(item.status!==undefined){
        matchFilter=item.status===crudFilter;
      }else if(item.direction!==undefined){
        matchFilter=item.direction===crudFilter;
      }
    }
    return matchSearch&&matchFilter;
  });
  document.getElementById('crudList').innerHTML=renderCRUDCards(entity,filtered);
}

// ==================== CRUD Form ====================
function openCRUDForm(entity,id){
  var config=CRUD_CONFIG[entity];
  if(!config){return}
  
  var item=id?MOCK[entity].find(function(d){return d.id===id}):null;
  var isEdit=!!item;
  
  var html='<div class="modal-header"><div class="mh-title">'+(isEdit?'编辑':'新增')+config.title.replace('管理','').replace('明细','')+'</div><div class="mh-close" onclick="closeModal()">×</div></div>';
  html+='<div class="modal-body">';
  
  config.columns.forEach(function(col){
    var val=item?item[col.key]||'':'';
    if(col.type==='select'){
      html+='<div class="form-group"><label>'+(col.required?'<span class="req">*</span> ':'' )+col.label+'</label><select id="field_'+col.key+'">';
      col.options.forEach(function(opt){
        html+='<option value="'+opt.value+'"'+(val==opt.value?' selected':'')+'>'+opt.label+'</option>';
      });
      html+='</select></div>';
    }else if(col.type==='textarea'){
      html+='<div class="form-group"><label>'+(col.required?'<span class="req">*</span> ':'' )+col.label+'</label><textarea id="field_'+col.key+'">'+val+'</textarea></div>';
    }else if(col.type==='date'){
      html+='<div class="form-group"><label>'+(col.required?'<span class="req">*</span> ':'' )+col.label+'</label><input type="date" id="field_'+col.key+'" value="'+val+'"></div>';
    }else if(col.type==='number'){
      html+='<div class="form-group"><label>'+(col.required?'<span class="req">*</span> ':'' )+col.label+'</label><input type="number" id="field_'+col.key+'" value="'+val+'"></div>';
    }else{
      html+='<div class="form-group"><label>'+(col.required?'<span class="req">*</span> ':'' )+col.label+'</label><input type="text" id="field_'+col.key+'" value="'+val+'"></div>';
    }
  });
  
  html+='<div class="form-actions">';
  html+='<button class="btn-secondary" onclick="closeModal()">取消</button>';
  html+='<button class="btn-primary" onclick="saveCRUDItem(\''+entity+'\','+(id||0)+')">'+(isEdit?'保存':'添加')+'</button>';
  html+='</div>';
  html+='</div>';
  
  document.getElementById('modalContent').innerHTML=html;
  document.getElementById('modalBg').classList.add('show');
}

function closeModal(e){
  if(e&&e.target.id!=='modalBg')return;
  document.getElementById('modalBg').classList.remove('show');
}

function saveCRUDItem(entity,id){
  var config=CRUD_CONFIG[entity];
  if(!config){return}
  
  var item={};
  var valid=true;
  config.columns.forEach(function(col){
    var el=document.getElementById('field_'+col.key);
    var val=el.value.trim();
    if(col.required&&!val){showToast(col.label+'不能为空');valid=false;return}
    if(col.type==='number'){val=parseInt(val)||0}
    if(col.key==='read'){val=val==='true'||val===true}
    item[col.key]=val;
  });
  
  if(!valid)return;
  
  if(id){
    // Edit
    var idx=MOCK[entity].findIndex(function(d){return d.id===id});
    if(idx>=0){item.id=id;MOCK[entity][idx]=item}
    showToast('修改成功');
  }else{
    // Add
    item.id=Date.now();
    MOCK[entity].push(item);
    showToast('添加成功');
  }
  
  closeModal();
  renderCRUDPage(entity);
}

function deleteCRUDItem(entity,id){
  showConfirm('确定要删除这条记录吗？',function(){
    var idx=MOCK[entity].findIndex(function(d){return d.id===id});
    if(idx>=0){MOCK[entity].splice(idx,1);showToast('删除成功');renderCRUDPage(entity)}
  });
}

function reviewRegistration(id,action){
  var reg=MOCK.registrations.find(function(r){return r.id===id});
  if(reg){
    reg.status=action;
    showToast(action==='approved'?'已通过审核':'已拒绝申请');
    renderCRUDPage('registrations');
  }
}

function filterPatients(){

  var restricted=currentPage==='patientQuery'&&currentPort!=='clinic';
  var filtered=MOCK.patients.filter(function(p){
    var matchSearch=true;
    if(search){
      matchSearch=(p.name&&p.name.toLowerCase().indexOf(search)>=0)||(p.diagnosis&&p.diagnosis.toLowerCase().indexOf(search)>=0)||(p.doctor&&p.doctor.toLowerCase().indexOf(search)>=0);
    }
    var matchFilter=patientFilter?p.type===patientFilter:true;
    return matchSearch&&matchFilter;
  });
  document.getElementById('patientList').innerHTML=renderPatientCards(filtered,restricted);
}

function renderPatientCards(data,restricted){
  if(!data||data.length===0){
    return '<div class="empty"><div class="em-icon">👥</div><div class="em-text">暂无患者数据</div></div>';
  }
  var html='';
  data.forEach(function(p){
    html+='<div class="data-card" onclick="showPatientDetail('+p.id+')">';
    html+='<div class="dc-header"><div class="dc-title">'+p.name+' ('+p.gender+','+p.age+'岁)</div><span class="badge '+(p.type==='种植'?'badge-success':p.type==='修复'?'badge-info':'badge-purple')+'">'+p.type+'</span></div>';
    html+='<div class="dc-body">';
    if(!restricted){
      html+='<div class="dc-field"><span>电话:</span> '+p.phone+'</div>';
    }
    if(p.diagnosis)html+='<div class="dc-field"><span>诊断:</span> '+p.diagnosis+'</div>';
    if(p.implantModel)html+='<div class="dc-field"><span>种植体:</span> '+p.implantModel+'</div>';
    if(p.surgeryDate)html+='<div class="dc-field"><span>手术日期:</span> '+p.surgeryDate+'</div>';
    if(p.doctor)html+='<div class="dc-field"><span>主治医生:</span> '+p.doctor+'</div>';
    html+='</div>';
    html+='<div class="dc-footer"><span style="font-size:12px;color:var(--text-muted)">点击查看详情</span></div>';
    html+='</div>';
  });
  return html;
}

function getOrderStage(status){
  var map={
    pending:{label:'待接单',icon:'⏳'},
    processing:{label:'加工中',icon:'🔄'},
    shipped:{label:'已发货',icon:'🚚'},
    received:{label:'已签收',icon:'✅'}
  };
  return map[status]||{label:status,icon:'❓'};
}

// ==================== Financial Reports ====================
function renderReports(){
  var income=MOCK.transactions.filter(function(t){return t.direction==='收入'}).reduce(function(s,t){return s+t.amount},0);
  var expense=MOCK.transactions.filter(function(t){return t.direction==='支出'}).reduce(function(s,t){return s+t.amount},0);
  var profit=income-expense;
  var margin=income>0?((profit/income)*100).toFixed(1):0;
  
  var html='<div class="stats-grid" style="padding-top:12px">';
  html+='<div class="stat-card"><div class="sc-icon" style="background:#e8f8f0">📈</div><div class="sc-info"><div class="sc-value">¥'+income.toLocaleString()+'</div><div class="sc-label">总收入</div></div></div>';
  html+='<div class="stat-card"><div class="sc-icon" style="background:#fdeaea">📉</div><div class="sc-info"><div class="sc-value">¥'+expense.toLocaleString()+'</div><div class="sc-label">总支出</div></div></div>';
  html+='<div class="stat-card"><div class="sc-icon" style="background:#e8f4fd">💰</div><div class="sc-info"><div class="sc-value">¥'+profit.toLocaleString()+'</div><div class="sc-label">净利润</div></div></div>';
  html+='<div class="stat-card"><div class="sc-icon" style="background:#fef5e7">📊</div><div class="sc-info"><div class="sc-value">'+margin+'%</div><div class="sc-label">利润率</div></div></div>';
  html+='</div>';
  
  // Chart bars
  html+='<div class="section"><div class="section-title">月度收支趋势</div></div>';
  html+='<div class="chart">';
  var months=['1月','2月','3月','4月','5月','6月'];
  var data=[18000,22000,25000,20000,28000,30000];
  var maxVal=Math.max.apply(null,data);
  months.forEach(function(m,i){
    var h=(data[i]/maxVal*100)|0;
    html+='<div class="chart-bar"><div class="cb-bar" style="height:'+h+'%;background:linear-gradient(180deg,#1abc9c,#16a085)"></div><div class="cb-label">'+m+'</div></div>';
  });
  html+='</div>';
  
  // Pie chart
  html+='<div class="section"><div class="section-title">收入构成</div></div>';
  var settlementTypes={
    '种植体结算':MOCK.settlements.filter(function(s){return s.type==='种植体结算'}).reduce(function(s,c){return s+c.amount},0),
    '种植卡结算':MOCK.settlements.filter(function(s){return s.type==='种植卡结算'}).reduce(function(s,c){return s+c.amount},0),
    '佣金结算':MOCK.settlements.filter(function(s){return s.type==='佣金结算'}).reduce(function(s,c){return s+c.amount},0)
  };
  var totalPie=Object.values(settlementTypes).reduce(function(s,v){return s+v},0)||1;
  var colors=['#1abc9c','#3498db','#f39c12'];
  var deg1=(settlementTypes['种植体结算']/totalPie*360);
  var deg2=(settlementTypes['种植卡结算']/totalPie*360);
  html+='<div class="pie-container">';
  html+='<div class="pie-chart" style="background:conic-gradient(#1abc9c 0deg '+deg1+'deg, #3498db '+deg1+'deg '+(deg1+deg2)+'deg, #f39c12 '+(deg1+deg2)+'deg 360deg)"></div>';
  html+='<div class="pie-legend">';
  var i=0;
  for(var key in settlementTypes){
    html+='<div class="pie-legend-item"><div class="pl-dot" style="background:'+colors[i]+'"></div>'+key+': ¥'+settlementTypes[key].toLocaleString()+'</div>';
    i++;
  }
  html+='</div></div>';
  
  // Income details
  html+='<div class="section"><div class="section-title">收入明细</div></div>';
  html+='<div class="card-list">';
  MOCK.transactions.forEach(function(t){
    html+='<div class="data-card"><div class="dc-header"><div class="dc-title">'+t.item+'</div><span class="badge '+(t.direction==='收入'?'badge-success':'badge-danger')+'">'+t.direction+'</span></div>';
    html+='<div class="dc-body"><div class="dc-field"><span>日期:</span> '+t.date+'</div><div class="dc-field"><span>金额:</span> ¥'+t.amount.toLocaleString()+'</div></div>';
    html+='<div class="dc-footer"><span class="badge '+(t.status==='completed'?'badge-success':'badge-warning')+'">'+(t.status==='completed'?'已完成':'待确认')+'</span></div>';
    html+='</div>';
  });
  html+='</div>';
  
  document.getElementById('contentArea').innerHTML=html;
}
